<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Vue 3.4 Template</title>
		<link
			rel="stylesheet"
			href="https://unpkg.com/normalize.css/normalize.css"
		/>
		<style type="text/css">
			body {
				font-family: monospace;
				padding: 20px;
				font-size: 2em;
			}

			.can {
				color: green;
			}
			.cannot {
				color: brown;
			}
		</style>
		<script src="https://unpkg.com/vue@3.4.0"></script>
	</head>

	<body>
		<div id="app">
			<div v-on:click="changeName">{{message}} | {{age}}</div>
			<div v-on:click="changeName">
				Can you drive ?
				<span
					:class="{ 
						can: canDrive === 'YES',
						cannot: canDrive !== 'YES'
					}"
					>{{canDrive}}</span
				>
			</div>
		</div>
		<script>
			const { createApp, ref, computed } = Vue;
			const App = {
				setup() {
					let message = ref("Hello");
					let age = ref(null);
					let canDrive = computed(() => {
						console.log("[computed]..", `AGE: ${age.value}`);
						message.value = age.value > 70 ? "Senior DL" : message.value;
						return age.value > 18 ? "YES" : "NO";
					});

					return { message, canDrive, age };
				},
				/**
				 *
				 */
				methods: {
					changeName() {
						console.log("OPA");
						this.message = `Age.`;
						this.age = this.age + 16;

						console.log("AGE [", this.age, "]");
					},
				},
			};

			createApp(App).mount("#app");
		</script>
	</body>
</html>
