<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>02 - IMAGE GALLERY</title>
		<link
			rel="stylesheet"
			href="https://unpkg.com/normalize.css/normalize.css"
		/>
		<style type="text/css">
			body {
				font-family: monospace;
				padding: 20px;
				font-size: 16px;
			}

			.gallery {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				grid-gap: 10px;
			}

			.photo {
				position: relative;
				border: 1px solid #ccc;
			}

			.photo img {
				width: 100%;
				display: block;
			}

			.favorite-button {
				background: none;
				border: none;
				color: #ccc;
				font-size: 24px;
				position: absolute;
				bottom: 8px;
				right: 5px;
				cursor: pointer;
			}

			.favorite-button.active {
				color: gold;
			}

			.no-photos {
				text-align: center;
				color: #999;
			}

			form {
				margin-bottom: 20px;
			}
		</style>
		<script src="https://unpkg.com/vue@3.4.0"></script>
	</head>

	<body>
		<div id="app">
			<div><h2>DIEGO'S PHOTO GALLERY</h2></div>
			<!-- Form for Adding Photos -->
			<form @submit.prevent="addPhoto">
				<input
					placeholder="Enter image URL"
					v-model="newPhoto"
				/>
				<button type="submit">Add Photo</button>
			</form>

			<!-- Conditional Rendering -->
			<div
				v-if="hasPhotos === true"
				class="gallery"
			>
				<!-- List Rendering and Conditional Class Binding -->
				<div
					class="photo"
					v-for="thisPhoto in arPhotos"
					:key="thisPhoto.id"
				>
					<!-- An image goes here -->
					<img
						:src="thisPhoto.url"
						alt=""
						@click="removePhoto(thisPhoto.id)"
					/>
					<button
						class="favorite-button"
						:class="{
                            'active' : thisPhoto.isFavorite
                        }"
						@click="toggleFavorite(thisPhoto)"
					>
						★
					</button>
				</div>
			</div>
			<p
				v-else
				class="no-photos"
			>
				No photos added yet. Add some!
			</p>
		</div>

		<script>
			const { createApp, ref, computed } = Vue;
			const App = {
				setup() {
					// Keep track of the list of photos
					let arPhotos = ref([]);
					let hasPhotos = computed(() => {
						return arPhotos.value.length > 0;
					});
					let newPhoto = ref(null);

					// We need a ref for the currently entered URL
					const addPhoto = (e) => {
						// e.preventDefault();
						// Adding photo logic goes here
						console.log("[addPhoto]", newPhoto.value);
						if (newPhoto.value) {
							let obPhoto = {
								id: arPhotos.value.length + 1,
								url: newPhoto.value,
								isFavorite: false,
							};
							arPhotos.value.push(obPhoto);
						}
						console.log(`Now arPhotos has ${arPhotos.value.length} qtty`);
						newPhoto.value = null;
					};
					const toggleFavorite = (obPhoto) => {
						// Favorite toggling logic
						console.log("[toggleFavorite]", { obPhoto });
						obPhoto.isFavorite = !obPhoto.isFavorite;
					};

					const removePhoto = (idToRemove) => {
						console.log("[removePhoto]", { idToRemove });

						let arrayPhotos = arPhotos.value;
						let index = arrayPhotos.findIndex((item) => item.id === idToRemove);

						if (index !== -1) {
							arPhotos.value.splice(index, 1);
						}
					};

					return { addPhoto, toggleFavorite, removePhoto, hasPhotos, arPhotos, newPhoto };
				},
			};
			createApp(App).mount("#app");
		</script>
	</body>
</html>
